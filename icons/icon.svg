<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient: Apple Pro Dark Slate -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1c1e"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>

    <!-- Vibrant Blue Accent -->
    <linearGradient id="blueGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a84ff"/>
      <stop offset="100%" stop-color="#0066cc"/>
    </linearGradient>

    <!-- Outer Rim Highlight -->
    <linearGradient id="rimHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.16)"/>
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.02)"/>
    </linearGradient>

    <!-- Mirror Glow -->
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0a84ff" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- iOS Continuous Squircle Background -->
  <rect x="16" y="16" width="480" height="480" rx="112" ry="112" fill="url(#bgGradient)" stroke="url(#rimHighlight)" stroke-width="4"/>

  <!-- Inner Camera Housing Plate (Subtle depth) -->
  <rect x="80" y="120" width="352" height="280" rx="44" fill="#2c2c2e" stroke="rgba(255,255,255,0.06)" stroke-width="2"/>
  
  <!-- Camera Top Notch / Sensor -->
  <path d="M 196 120 L 216 88 L 296 88 L 316 120 Z" fill="#2c2c2e"/>
  <circle cx="372" cy="164" r="10" fill="#ff453a" opacity="0.9"/> <!-- Recording indicator lamp -->

  <!-- Outer Lens Ring -->
  <circle cx="256" cy="260" r="92" fill="#1c1c1e" stroke="rgba(255,255,255,0.1)" stroke-width="4"/>

  <!-- Inner Blue Aperture Circle -->
  <circle cx="256" cy="260" r="76" fill="url(#blueGradient)" filter="url(#subtleGlow)"/>

  <!-- Mirror Line (Vertical hairline split) -->
  <line x1="256" y1="184" x2="256" y2="336" stroke="rgba(255, 255, 255, 0.4)" stroke-width="3" stroke-dasharray="8 6"/>

  <!-- Left Symmetrical Flip Arrow (White) -->
  <path d="M 226 235 L 202 260 L 226 285" fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 204 260 L 242 260" fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round"/>

  <!-- Right Symmetrical Flip Arrow (White) -->
  <path d="M 286 235 L 310 260 L 286 285" fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 308 260 L 270 260" fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round"/>
</svg>
